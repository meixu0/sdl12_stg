name: Build Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2 and Install Dependencies (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-SDL
          mingw-w64-x86_64-SDL_image
          mingw-w64-x86_64-SDL_ttf
          mingw-w64-x86_64-SDL_mixer
          mingw-w64-x86_64-SDL_gfx
          mingw-w64-x86_64-physfs
          zip

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libsdl1.2-dev \
          libsdl-image1.2-dev \
          libsdl-ttf2.0-dev \
          libsdl-mixer1.2-dev \
          libsdl-gfx1.2-dev \
          libphysfs-dev

    - name: Compile Game (Linux)
      if: runner.os == 'Linux'
      run: |
        make clean
        make -j$(nproc)

    - name: Compile Game and Bundle DLLs (Windows)
      if: runner.os == 'Windows'
      run: |
        mingw32-make clean
        mingw32-make -j$(nproc)

        echo "Creating release directory..."
        mkdir -p release

        echo "Copying executable..."
        cp stg.exe release/

        echo "Bundling DLLs..."
        dll_list=$(ldd stg.exe | grep -i "mingw64" | awk '{print $3}' | sort -u)
        for dll in $dll_list; do
          if [ -f "$dll" ]; then
            cp "$dll" release/
            echo "  Copied: $(basename $dll)"
          fi
        done

        # Also copy SDL_image format handler DLLs (loaded at runtime)
        for pattern in libpng*.dll libjpeg*.dll libtiff*.dll libwebp*.dll libfreetype*.dll libogg*.dll libvorbis*.dll libFLAC*.dll; do
          found=$(find /mingw64/bin -name "$pattern" 2>/dev/null | head -1)
          if [ -n "$found" ] && [ ! -f "release/$(basename $found)" ]; then
            cp "$found" release/
            echo "  Also copied: $(basename $found)"
          fi
        done

        echo "Copying level/ and res/ directories..."
        cp -r level release/
        cp -r res release/

        echo "Creating zip archive..."
        cd release
        zip -r ../stg-windows.zip .
        cd ..

        echo "Release zip size:"
        ls -lh stg-windows.zip

    - name: Upload Artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: game-executable-linux
        path: |
          stg
          res/**
          level/**

    - name: Upload Artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: game-executable-windows
        path: stg-windows.zip
